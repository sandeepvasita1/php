<html>
<head>
<script>
function showdata()
{
var xmlhttp = new XMLHttpRequest();
var str=document.getElementById("t1").value;

xmlhttp.open("GET","u4p12.php?t1="+str,true);
xmlhttp.onreadystatechange=function()
{
if(xmlhttp.readyState==4)
{
document.getElementById("info").innerHTML=xmlhttp.responseText;
}

}
xmlhttp.send();

}
</script>
</head>
<body>

<form method="post">

Enter Student ID:
<input type="text" id="t1">

<input type="button" name="demo" value="demo" onclick="showdata()">

</form>
<div id="info"></div>
</body>
</html>
